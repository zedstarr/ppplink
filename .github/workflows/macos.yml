# Builds and tests the macOS command and menu-bar app on every change to them.
name: macOS

on:
  push:
    paths: ["macos/**", "app/src/main/cpp/slirp/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "app/src/main/cpp/slirp/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build slirp, engine and ppplink
        run: make -C macos

      - name: End-to-end test
        run: make -C macos test

      - name: Install test
        run: |
          make -C macos install PREFIX="$RUNNER_TEMP/pl"
          "$RUNNER_TEMP/pl/bin/ppplink" version
          "$RUNNER_TEMP/pl/bin/ppplink" setup
          "$RUNNER_TEMP/pl/bin/ppplink" list

      - name: Build PPP Link.app
        run: ZIP=1 make -C macos app

      - uses: actions/upload-artifact@v4
        with:
          name: PPP-Link-macOS
          path: macos/build/PPP-Link-*-macOS.zip
